name: APIWatch checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: apiwatch_test
          POSTGRES_USER: apiwatch
          POSTGRES_PASSWORD: ci-only-disposable-password
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U apiwatch -d apiwatch_test" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B -f backend/pom.xml verify
      - run: mvn -B -f backend/pom.xml test -Dspring.datasource.url=jdbc:postgresql://localhost:5432/apiwatch_test -Dspring.datasource.username=apiwatch -Dspring.datasource.password=ci-only-disposable-password
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
