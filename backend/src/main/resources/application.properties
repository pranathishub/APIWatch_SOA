spring.application.name=APIWatch
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/apiwatch}
spring.datasource.username=${DB_USER:apiwatch}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.port=${PORT:8080}
server.error.include-message=never
apiwatch.jwt-secret=${JWT_SECRET}
apiwatch.cors-origin=${FRONTEND_ORIGIN:http://localhost:5173}
apiwatch.allow-private-targets=${ALLOW_PRIVATE_TARGETS:false}
apiwatch.scheduler-enabled=${SCHEDULER_ENABLED:true}
