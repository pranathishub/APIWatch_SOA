spring.datasource.url=jdbc:h2:mem:apiwatch;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
apiwatch.jwt-secret=test-only-secret-at-least-thirty-two-bytes-long
apiwatch.cors-origin=http://localhost:5173
apiwatch.allow-private-targets=true
apiwatch.scheduler-enabled=false
